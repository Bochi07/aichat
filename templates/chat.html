<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>个人学习实验台</title>
<link rel="stylesheet" href="static/style.css">
<script>
/* ===== 内建轻量 Markdown 渲染器 ===== */
(function(){
const esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
const parseInline=function(s){
  s=esc(s);
  // 仅允许 http/https/mailto 协议，拦截 javascript:/data:/vbscript: 等
  const safeUrl=function(raw){
    var u=(raw||'').trim();
    if(!u)return'';
    var m=u.match(/^([a-zA-Z][a-zA-Z0-9+.-]*):/);
    if(m&&['http','https','mailto'].indexOf(m[1].toLowerCase())<0)return'#';
    return u;
  };
  // 图片先（避免与链接冲突）
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,function(_,alt,url,title){
    return'<img src="'+safeUrl(url)+'" alt="'+alt+'" title="'+(title||'')+'">';
  });
  // 链接
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"([^"]*)")?\)/g,function(_,text,url,title){
    return'<a href="'+safeUrl(url)+'" title="'+(title||'')+'" target="_blank" rel="noopener">'+text+'</a>';
  });
  // 粗斜体
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s=s.replace(/___(.+?)___/g,'<strong><em>$1</em></strong>');
  // 粗体
  s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__(.+?)__/g,'<strong>$1</strong>');
  // 斜体
  s=s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s=s.replace(/_(.+?)_/g,'<em>$1</em>');
  // 删除线
  s=s.replace(/~~(.+?)~~/g,'<del>$1</del>');
  // 行内代码
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  return s;
};
const parseCells=function(row){const cells=[],re=/\|/g;let last=0,m;while((m=re.exec(row))!==null){cells.push(row.slice(last,m.index).trim());last=m.index+1;}cells.push(row.slice(last).trim());return cells.filter((_,j,a)=>!(j===0&&a[0]==='')&&!(j===a.length-1&&a[a.length-1]===''));};
const isSepRow=function(row){const cells=parseCells(row);return cells.length>0&&cells.every(c=>/^:?-{3,}:?$/.test(c.trim()));};
window.renderMarkdown=function(text){
  if(!text)return'';
  try{
    const lines=text.split('\n'),out=[];
    let i=0,buf=[],inCode=false,codeLang='',codeContent='',tableRows=[];
    const flushBuf=function(){
      if(!buf.length)return;
      const joined=buf.join('\n');
      if(joined.split('\n').every(function(l){return l.match(/^>\s?/);})){
        out.push('<blockquote>'+window.renderMarkdown(buf.map(function(l){return l.replace(/^>\s?/,'');}).join('\n'))+'</blockquote>');
      }else{
        out.push('<p>'+buf.map(function(l){return parseInline(l);}).join('<br>')+'</p>');
      }
      buf=[];
    };
    const flushTable=function(){
      if(!tableRows.length)return;
      const rows=tableRows.slice();
      if(rows.length>=2&&isSepRow(rows[1])){
        const headCells=parseCells(rows[0]);
        out.push('<table><thead><tr>'+headCells.map(function(c){return'<th>'+parseInline(c)+'</th>';}).join('')+'</tr></thead><tbody>');
        for(let k=2;k<rows.length;k++){
          const cells=parseCells(rows[k]);
          out.push('<tr>'+cells.map(function(c){return'<td>'+parseInline(c)+'</td>';}).join('')+'</tr>');
        }
        out.push('</tbody></table>');
      }else{
        out.push('<table><tbody>');
        for(let k=0;k<rows.length;k++){
          const cells=parseCells(rows[k]);
          out.push('<tr>'+cells.map(function(c){return'<td>'+parseInline(c)+'</td>';}).join('')+'</tr>');
        }
        out.push('</tbody></table>');
      }
      tableRows=[];
    };
    while(i<lines.length){
      const line=lines[i],trimmed=line.trim();
      if(trimmed.startsWith('```')){
        flushBuf();flushTable();
        if(!inCode){inCode=true;codeLang=trimmed.slice(3).trim();codeContent='';}
        else{inCode=false;out.push('<pre><code'+(codeLang?' class="language-'+esc(codeLang)+'"':'')+'>'+esc(codeContent.replace(/\n$/,''))+'</code></pre>');}
        i++;continue;
      }
      if(inCode){codeContent+=line+'\n';i++;continue;}
      if(/^(-{3,}|_{3,}|\*{3,})$/.test(trimmed)){flushBuf();flushTable();out.push('<hr>');i++;continue;}
      const h=trimmed.match(/^(#{1,6})\s+(.+)/);
      if(h && !trimmed.startsWith('# ')){flushBuf();flushTable();out.push('<h'+h[1].length+'>'+parseInline(h[2])+'</h'+h[1].length+'>');i++;continue;}
      // 修正：统一处理 # 标题
      const h2=trimmed.match(/^(#{1,6})\s+(.+)/);
      if(h2 && h===h2){i++;continue;}
      const ul=trimmed.match(/^[-*+]\s+(.+)/);
      if(ul){flushBuf();flushTable();const items=[];while(i<lines.length){const m2=lines[i].trim().match(/^[-*+]\s+(.+)/);if(!m2)break;items.push('<li>'+parseInline(m2[1])+'</li>');i++;}out.push('<ul>'+items.join('')+'</ul>');continue;}
      const ol=trimmed.match(/^\d+\.\s+(.+)/);
      if(ol){flushBuf();flushTable();const items=[];while(i<lines.length){const m2=lines[i].trim().match(/^\d+\.\s+(.+)/);if(!m2)break;items.push('<li>'+parseInline(m2[1])+'</li>');i++;}out.push('<ol>'+items.join('')+'</ol>');continue;}
      if(trimmed.includes('|')&&parseCells(trimmed).length>=1){
        flushBuf();tableRows.push(trimmed);i++;if(i>=lines.length||(!lines[i].trim().includes('|'))){flushTable();}continue;
      }
      if(!trimmed){flushBuf();if(tableRows.length)flushTable();i++;continue;}
      buf.push(line);i++;
    }
    flushBuf();flushTable();
    return out.join('\n');
  }catch(e){return esc(text).replace(/\n/g,'<br>');}
};
})();
</script>
</head>
<body class="chat-page">
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">记录列表</span>
            <button class="btn-icon" onclick="toggleSidebar()">✕</button>
        </div>
        <button class="btn btn-new-chat" onclick="newChat()">+ 新建实验</button>
        <input type="text" id="search-input" class="search-input" placeholder="搜索记录..." autocomplete="off" oninput="onSearch()">
        <div class="chat-list" id="chat-list"></div>
        <div class="sidebar-footer">
            <a href="settings" class="sidebar-link">⚙ 设置</a>
            <a href="#" onclick="logout()" class="sidebar-link">退出登录</a>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main class="main-area">
        <header class="chat-header">
            <button class="btn-icon menu-btn" onclick="toggleSidebar()">☰</button>
            <span class="chat-title" id="chat-title" onclick="renameCurrentChat()" title="点击修改名称">个人学习实验台</span>
            <button class="btn-icon" onclick="deleteChat()" id="btn-delete" style="display:none">🗑</button>
        </header>
        <div class="model-bar">
            <select id="provider-select" class="model-select" onchange="onProviderChange()"></select>
            <select id="model-select" class="model-select" onchange="savePrefs()"></select>
            <label class="think-toggle" id="think-label">
                <input type="checkbox" id="deep-think" onchange="savePrefs()"> 深度分析
            </label>
        </div>
        <div class="system-prompt-bar">
            <div class="sp-header" onclick="toggleSystemPrompt()"><span>🎭 实验参数</span><span id="sp-toggle">展开</span></div>
            <div class="sp-body" id="sp-body" style="display:none">
                <textarea id="system-prompt-input" class="input" rows="3" placeholder="设定实验参数..."></textarea>
                <button class="btn btn-sm" onclick="saveSystemPrompt()">保存参数</button>
            </div>
        </div>
        <div class="messages-container" id="messages">
            <div class="empty-state"><div class="empty-icon">💬</div><p>开始新实验</p></div>
        </div>
        <div class="input-area">
            <form class="input-form" onsubmit="sendMessage(event)" id="msg-form">
                <textarea id="msg-input" class="input chat-input" placeholder="输入内容..." autocomplete="off" rows="1" enterkeyhint="send"></textarea>
                <button type="submit" class="btn btn-send" id="btn-send">运行</button>
                <button type="button" class="btn btn-stop" id="btn-stop" style="display:none" onclick="stopStream()">中止</button>
            </form>
        </div>
    </main>
</div>

<script>
let currentChatId=null,abortController=null,currentMessageIds={},searchTimer=null;
let sidebarOpen=!window.matchMedia('(max-width:1023px)').matches;
const PROVIDER_LIST=['deepseek','qwen','ernie','mimo'];
let PROVIDERS={},providerModels={};

async function loadProviders(){
    const resp=await fetch('api/providers');
    PROVIDERS=await resp.json();
    const sel=document.getElementById('provider-select');
    sel.innerHTML=PROVIDER_LIST.map(p=>`<option value="${p}">${(PROVIDERS[p]||{}).name||p}</option>`).join('');
    const saved=localStorage.getItem('provider')||'deepseek';
    sel.value=saved in PROVIDERS?saved:'deepseek';
    onProviderChange(false);
    const m=localStorage.getItem('model');
    if(m&&providerModels[saved]&&providerModels[saved].includes(m))document.getElementById('model-select').value=m;
    document.getElementById('deep-think').checked=localStorage.getItem('deepThink')==='true';
    document.getElementById('think-label').style.display=(sel.value==='deepseek'||sel.value==='mimo'||sel.value==='qwen')?'':'none';
}
function onProviderChange(save=true){
    const pid=document.getElementById('provider-select').value;
    providerModels=PROVIDERS[pid]?PROVIDERS[pid].models:[];
    const def=PROVIDERS[pid]?PROVIDERS[pid].default_model:providerModels[0]||'';
    const sel=document.getElementById('model-select');
    sel.innerHTML=providerModels.map(m=>`<option value="${m}">${m}</option>`).join('');
    sel.value=localStorage.getItem('model')&&providerModels.includes(localStorage.getItem('model'))?localStorage.getItem('model'):def;
    document.getElementById('think-label').style.display=(pid==='deepseek'||pid==='mimo'||pid==='qwen')?'':'none';
    if(save)savePrefs();
}
function savePrefs(){localStorage.setItem('provider',document.getElementById('provider-select').value);localStorage.setItem('model',document.getElementById('model-select').value);localStorage.setItem('deepThink',document.getElementById('deep-think').checked);}
loadProviders();loadChats();applySidebarState();
// 输入框自动扩展 + Enter发送/Shift+Enter换行
(function(){var t=document.getElementById('msg-input');t.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,150)+'px';});t.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('msg-form').requestSubmit();}});})();

function applySidebarState(){
    document.getElementById('sidebar').classList.toggle('open',sidebarOpen);
    document.getElementById('sidebar-overlay').classList.toggle('show',sidebarOpen&&window.matchMedia('(max-width:1023px)').matches);
}
function toggleSidebar(){sidebarOpen=!sidebarOpen;applySidebarState();}
window.matchMedia('(max-width:1023px)').addEventListener('change',e=>{sidebarOpen=!e.matches;applySidebarState();});

let touchStartX=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-touchStartX;
    if(dx>60&&touchStartX<30&&!sidebarOpen){sidebarOpen=true;applySidebarState();}
    if(dx<-60&&sidebarOpen&&window.matchMedia('(max-width:1023px)').matches){sidebarOpen=false;applySidebarState();}
},{passive:true});

function onSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadChats(),300);}
async function loadChats(){
    const q=document.getElementById('search-input')?document.getElementById('search-input').value.trim():'';
    const resp=await fetch('api/chats'+(q?'?search='+encodeURIComponent(q):''));
    const chats=await resp.json();
    document.getElementById('chat-list').innerHTML=chats.map(c=>`<div class="chat-item ${c.id===currentChatId?'active':''}" onclick="selectChat(${c.id},${c.hit_msg_id||0})"><div class="chat-item-row"><span class="chat-item-title" id="ctitle-${c.id}">${escHtml(c.title)}</span><button class="chat-item-edit" onclick="event.stopPropagation();event.preventDefault();startRename(${c.id})" title="修改名称">✎</button></div>${c.hit_snippet?`<span class="chat-item-snippet">${escHtml(c.hit_snippet.slice(0,80))}</span>`:''}<span class="chat-item-date">${formatDate(c.updated_at)}</span></div>`).join('')||'<div class="empty-chats">暂无记录</div>';
}

function newChat(){
    currentChatId=null;currentMessageIds={};
    document.getElementById('chat-title').textContent='新实验';
    document.getElementById('btn-delete').style.display='none';
    document.getElementById('messages').innerHTML='<div class="empty-state"><div class="empty-icon">💬</div><p>开始新实验</p></div>';
    document.getElementById('system-prompt-input').value='';
    document.getElementById('sp-body').style.display='block';
    document.getElementById('sp-toggle').textContent='收起';
    document.getElementById('msg-input').focus();
    if(window.matchMedia('(max-width:1023px)').matches)toggleSidebar();
}

async function selectChat(id,msgId){
    currentChatId=id;currentMessageIds={};
    const[msgsResp,chatsResp]=await Promise.all([fetch('api/chats/'+id+'/messages'),fetch('api/chats')]);
    const msgs=await msgsResp.json();
    const chat=(await chatsResp.json()).find(c=>c.id===id);
    document.getElementById('chat-title').textContent=chat?chat.title:'实验';
    document.getElementById('btn-delete').style.display='inline-block';
    document.getElementById('system-prompt-input').value=chat?chat.system_prompt:'';
    const el=document.getElementById('messages');
    el.innerHTML=msgs.length?msgs.map(m=>renderMessage(m)).join(''):'<div class="empty-state"><p>开始实验吧</p></div>';
    scrollToBottom(false);
    if(msgId){setTimeout(()=>{const t=document.getElementById('msg-'+msgId);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.classList.add('highlight');setTimeout(()=>t.classList.remove('highlight'),2000);}},200);}
    loadChats();
    if(window.matchMedia('(max-width:1023px)').matches)toggleSidebar();
}

function renderMessage(m){
    const domId='msg-'+m.id;currentMessageIds[domId]=m.id;
    const hasR=m.role==='assistant'&&m.reasoning&&m.reasoning.trim();
    const isUser=m.role==='user';
    // 用户消息：纯文本；AI 消息：渲染 Markdown
    const rendered=isUser?escHtml(m.content).replace(/\n/g,'<br>'):renderMarkdown(m.content);
    return`<div class="message ${m.role}" id="${domId}"><div class="msg-header"><span class="msg-role">${isUser?'我':'助手'}</span><button class="msg-del" onclick="deleteMessage(${m.id},'${domId}')">✕</button></div>${hasR?`<div class="msg-reasoning collapsed"><div class="reasoning-bar" onclick="this.parentElement.classList.toggle('collapsed')"><span>分析过程</span><span class="reasoning-arrow">▾</span></div><div class="reasoning-body">${escHtml(m.reasoning)}</div></div>`:''}<div class="msg-content">${rendered}</div><button class="msg-copy" onclick="copyMsg(event)" title="复制"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>`;
}


async function deleteChat(){if(!currentChatId||!confirm('确定删除此记录？'))return;await fetch('api/chats/'+currentChatId,{method:'DELETE'});currentChatId=null;document.getElementById('chat-title').textContent='个人学习实验台';document.getElementById('btn-delete').style.display='none';document.getElementById('messages').innerHTML='<div class="empty-state"><p>记录已删除</p></div>';loadChats();}
async function deleteMessage(msgId,domId){if(!confirm('删除这条记录？'))return;const resp=await fetch('api/messages/'+msgId,{method:'DELETE'});if(resp.ok){document.getElementById(domId)&&document.getElementById(domId).remove();delete currentMessageIds[domId];if(!document.querySelectorAll('#messages .message').length)document.getElementById('messages').innerHTML='<div class="empty-state"><p>开始实验吧</p></div>';}}

function toggleSystemPrompt(){const b=document.getElementById('sp-body');b.style.display=b.style.display==='none'?'block':'none';document.getElementById('sp-toggle').textContent=b.style.display==='none'?'展开':'收起';}
async function saveSystemPrompt(){
    const sp=document.getElementById('system-prompt-input').value.trim();
    if(!currentChatId){
        const resp=await fetch('api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:sp.slice(0,30)||'新实验',system_prompt:sp})});
        const data=await resp.json();currentChatId=data.id;
        document.getElementById('chat-title').textContent=sp.slice(0,30)||'新实验';
        document.getElementById('btn-delete').style.display='inline-block';loadChats();
    }else{await fetch('api/chats/'+currentChatId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_prompt:sp})});}
    document.getElementById('msg-input').focus();
}

async function sendMessage(e){
    e.preventDefault();
    const input=document.getElementById('msg-input'),message=input.value.trim();
    if(!message)return;
    const provider=document.getElementById('provider-select').value;
    const model=document.getElementById('model-select').value;
    const deepThink=(provider==='deepseek'||provider==='mimo'||provider==='qwen')&&document.getElementById('deep-think').checked;

    if(!currentChatId){
        const sp=document.getElementById('system-prompt-input').value.trim();
        const resp=await fetch('api/chats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:message.slice(0,30),system_prompt:sp})});
        currentChatId=(await resp.json()).id;
        document.getElementById('chat-title').textContent=message.slice(0,30);
        document.getElementById('btn-delete').style.display='inline-block';loadChats();
    }
    input.value='';input.style.height='auto';setSendState(true);
    const userDomId=appendMessage('user',message);
    const aiDomId=appendMessage('assistant','',deepThink?'正在深度思考…':'正在快速回复…');
    abortController=new AbortController();
    let savedId=null;
    try{
        const resp=await fetch('api/chats/'+currentChatId+'/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,provider,model,deep_thinking:deepThink}),signal:abortController.signal});
        if(!resp.ok){
            let detail='请求失败 ('+resp.status+')';
            try{const err=await resp.json();if(err.detail)detail=err.detail;}catch(_){}
            updateMessage(aiDomId,'❌ '+detail);
            abortController=null;setSendState(false);loadChats();
            return;
        }
        const reader=resp.body.getReader(),decoder=new TextDecoder();
        let buffer='',hasReasoning=false,lastScroll=0;
        const flushLines=()=>{
            const lines=buffer.split('\n');
            buffer=lines.pop()||'';
            for(const line of lines){
                if(!line.startsWith('data: '))continue;
                const chunk=line.slice(6).replace(/\r$/,'');
                if(chunk==='[DONE]')return true;
                try{
                    const d=JSON.parse(chunk);
                    if(d.error)updateMessage(aiDomId,'❌ '+d.error);
                    else if(d.notice)showNotice(d.notice,aiDomId);
                    else if(d.reasoning&&deepThink){hasReasoning=true;appendReasoning(aiDomId,d.reasoning);}
                    else if(d.content)appendContent(aiDomId,d.content);
                    else if(d.saved_id)savedId=d.saved_id;
                    const now=Date.now();if(now-lastScroll>80){lastScroll=now;scrollToBottom(true);}
                }catch(_){}
            }
            return false;
        };
        while(true){const{done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});if(flushLines())break;}
        flushLines();
        scrollToBottom(false);
        finalizeMarkdown(aiDomId);
        if(hasReasoning){const r=document.getElementById(aiDomId)&&document.getElementById(aiDomId).querySelector('.msg-reasoning');if(r)r.classList.add('collapsed');}
        if(savedId){const el=document.getElementById(aiDomId);if(el){el.id='msg-'+savedId;currentMessageIds[el.id]=savedId;const h=el.querySelector('.msg-header');if(h&&!h.querySelector('.msg-del')){const b=document.createElement('button');b.className='msg-del';b.textContent='✕';b.setAttribute('onclick','deleteMessage('+savedId+',\''+el.id+'\')');h.appendChild(b);}}}
        if(!savedId)await refreshMessages();
    }catch(err){if(err.name!=='AbortError')updateMessage(aiDomId,'❌ '+err.message);await refreshMessages();}
    abortController=null;setSendState(false);loadChats();
}

function setSendState(s){document.getElementById('btn-send').style.display=s?'none':'inline-block';document.getElementById('btn-stop').style.display=s?'inline-block':'none';}
function stopStream(){if(abortController)abortController.abort();}
function scrollToBottom(smooth){const el=document.getElementById('messages');smooth?el.scrollTop=el.scrollHeight:el.scrollTo({top:el.scrollHeight,behavior:'instant'});}
function showNotice(text,aiDomId){
    const el=document.getElementById('messages'),ai=el&&document.getElementById(aiDomId||'');if(!el)return;
    const d=document.createElement('div');d.className='msg-notice';d.textContent=text;
    if(ai)el.insertBefore(d,ai);else el.appendChild(d);
    scrollToBottom(false);
}

function appendMessage(role,content,placeholder){
    const el=document.getElementById('messages');if(el.querySelector('.empty-state'))el.querySelector('.empty-state').remove();
    const domId='msg-tmp-'+Date.now(),div=document.createElement('div');
    div.className='message '+role;div.id=domId;
    const isUser=role==='user';
    const display=isUser?escHtml(content).replace(/\n/g,'<br>'):(placeholder||'正在思考…');
    div.innerHTML=`<div class="msg-header"><span class="msg-role">${isUser?'我':'助手'}</span></div><div class="msg-content"${isUser?'':' data-raw=""'}>${display}</div><button class="msg-copy" onclick="copyMsg(event)" title="复制"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>`;
    el.appendChild(div);scrollToBottom(false);return domId;
}

function appendReasoning(domId,text){
    const el=document.getElementById(domId);if(!el)return;let r=el.querySelector('.msg-reasoning');
    const c=el.querySelector('.msg-content');if(c&&['...','正在思考…','正在深度思考…','正在快速回复…'].includes(c.textContent))c.textContent='';
    if(!r){r=document.createElement('div');r.className='msg-reasoning';r.innerHTML='<div class="reasoning-bar" onclick="this.parentElement.classList.toggle(\'collapsed\')"><span>分析过程</span><span class="reasoning-arrow">▾</span></div><div class="reasoning-body"></div>';el.querySelector('.msg-content').before(r);}
    r.querySelector('.reasoning-body').textContent+=text;
}
function appendContent(domId,text){const el=document.getElementById(domId);if(!el)return;const c=el.querySelector('.msg-content');if(el.classList.contains('assistant')){if(!c.dataset.raw)c.dataset.raw='';c.dataset.raw+=text;c.textContent=c.dataset.raw;}else{if(['...','正在思考…','正在深度思考…','正在快速回复…'].includes(c.textContent))c.textContent='';c.textContent+=text;}}
function updateMessage(domId,text){const el=document.getElementById(domId);if(!el)return;const c=el.querySelector('.msg-content');if(el.classList.contains('assistant')){c.dataset.raw=text;c.textContent=text;}else{c.textContent=text;}}
function finalizeMarkdown(domId){const el=document.getElementById(domId);if(!el)return;const c=el.querySelector('.msg-content');if(c&&c.dataset.raw){c.innerHTML=renderMarkdown(c.dataset.raw);}}

function getMsgRawText(el){const c=el.querySelector('.msg-content');return c.dataset.raw!==undefined?c.dataset.raw:c.textContent||'';}
function copyMsg(e){e.stopPropagation();e.preventDefault();var btn=e.currentTarget,msg=btn.closest('.message'),text=getMsgRawText(msg),done=function(){btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';setTimeout(function(){btn.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';},1500);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(function(){});}else{var ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(_){}document.body.removeChild(ta);}}

async function refreshMessages(){if(!currentChatId)return;const resp=await fetch('api/chats/'+currentChatId+'/messages'),msgs=await resp.json();currentMessageIds={};const el=document.getElementById('messages');el.innerHTML=msgs.length?msgs.map(m=>renderMessage(m)).join(''):'<div class="empty-state"><p>开始实验吧</p></div>';}

function startRename(id){
	const span=document.getElementById('ctitle-'+id);
	if(!span||span.querySelector('input'))return;
	const old=span.textContent;
	span.innerHTML=`<input class="chat-item-rename-input" value="${escHtml(old)}" onkeydown="if(event.key==='Enter'){event.preventDefault();saveRename(${id},this)}" onblur="saveRename(${id},this)" onclick="event.stopPropagation()">`;
	const inp=span.querySelector('input');
	inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
	span.dataset.old=old;
}
function saveRename(id,input){
	const title=input.value.trim()||'新实验';
	const span=document.getElementById('ctitle-'+id);
	if(!span)return;
	span.textContent=title;
	if(currentChatId===id)document.getElementById('chat-title').textContent=title;
	fetch('api/chats/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title})});
}
function renameCurrentChat(){
	if(!currentChatId)return;
	const titleEl=document.getElementById('chat-title');
	if(titleEl.querySelector('input'))return;
	const old=titleEl.textContent;
	titleEl.innerHTML=`<input class="chat-item-rename-input header-rename-input" value="${escHtml(old)}" onkeydown="if(event.key==='Enter'){event.preventDefault();saveHeaderRename(this)}" onblur="saveHeaderRename(this)">`;
	const inp=titleEl.querySelector('input');
	inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
	titleEl.dataset.old=old;
}
function saveHeaderRename(input){
	const title=input.value.trim()||'新实验';
	const titleEl=document.getElementById('chat-title');
	titleEl.textContent=title;
	const sid=document.getElementById('ctitle-'+currentChatId);
	if(sid)sid.textContent=title;
	fetch('api/chats/'+currentChatId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title})}).then(()=>loadChats());
}
function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function formatDate(ts){const d=new Date(ts*1000),n=new Date();if(d.toDateString()===n.toDateString())return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});return d.toLocaleDateString('zh-CN',{month:'short',day:'numeric'});}
async function logout(){await fetch('api/auth/logout',{method:'POST'});window.location.href='login';}
</script>
