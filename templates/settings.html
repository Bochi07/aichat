<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>设置 - 个人学习实验台</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body class="settings-page">
<div class="settings-container">
    <header class="settings-header">
        <a href="./" class="btn btn-back">← 返回</a>
        <h1>设置</h1>
    </header>

    <div class="settings-section">
        <h2>访问密钥</h2>
        <div id="key-status" style="font-size:13px;color:#94a3b8;margin:0 0 10px"></div>

        <div class="key-module">
            <div style="display:flex;gap:8px;margin-bottom:6px">
                <select id="provider-pick-1" class="model-select" style="min-width:110px"></select>
                <input type="text" id="key-input-1" class="input" style="flex:1;font-size:14px" placeholder="输入访问密钥..." autocomplete="off">
                <button class="btn btn-sm" onclick="saveKey(1)" style="background:var(--primary);color:#fff;white-space:nowrap">保存</button>
            </div>
            <div id="key-status-1" style="font-size:13px;color:#94a3b8;margin-top:4px"></div>
        </div>

        <div class="key-module" style="border-top:1px solid #e2e8f0;margin-top:14px;padding-top:12px">
            <h3 style="font-size:14px;margin:0 0 6px;color:#334155">额外密钥</h3>
            <div style="display:flex;gap:8px;margin-bottom:6px">
                <select id="provider-pick-2" class="model-select" style="min-width:110px"></select>
                <input type="text" id="key-input-2" class="input" style="flex:1;font-size:14px" placeholder="输入访问密钥..." autocomplete="off">
                <button class="btn btn-sm" onclick="saveKey(2)" style="background:var(--primary);color:#fff;white-space:nowrap">保存</button>
            </div>
            <div id="key-status-2" style="font-size:13px;color:#94a3b8;margin-top:4px"></div>
        </div>
    </div>

    <div class="settings-section">
        <h2>账号</h2>
        <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:14px">
            <span style="color:#94a3b8">用户名</span><span id="account-name" style="font-weight:500">-</span>
        </div>
        <hr style="border:none;border-top:1px solid #e2e8f0;margin:8px 0">
        <form id="pwd-form" onsubmit="changePassword(event)" style="display:flex;flex-direction:column;gap:10px">
            <input type="password" id="new-password" class="input" placeholder="新密码" required>
            <button type="submit" class="btn btn-primary">修改密码</button>
        </form>
        <div id="pwd-msg"></div>
        <hr style="border:none;border-top:1px solid #e2e8f0;margin:8px 0">
        <div class="qq-row">
            <span class="qq-label">绑定QQ</span>
            <span id="qq-display">-</span>
            <button class="btn btn-sm" onclick="editQQ()" id="btn-edit-qq">修改</button>
        </div>
        <div id="qq-edit-row" style="display:none">
            <input type="text" id="qq-input" class="input" placeholder="QQ号（5-11位数字）" maxlength="11" inputmode="numeric" autocomplete="off">
            <button class="btn btn-sm" onclick="saveQQ()" style="background:var(--primary);color:#fff;white-space:nowrap">保存</button>
            <button class="btn btn-sm" onclick="cancelEditQQ()" style="white-space:nowrap">取消</button>
        </div>
    </div>

    <div class="settings-section" style="border:1px solid #fecaca">
        <h2 style="color:#dc2626">注销账号</h2>
        <p style="font-size:13px;color:#94a3b8;margin-bottom:8px">输入「确认注销此账号」确认</p>
        <form id="del-form" onsubmit="deleteAccount(event)" style="display:flex;flex-direction:column;gap:10px">
            <input type="text" id="del-confirm" class="input" placeholder="确认注销此账号" required autocomplete="off">
            <button type="submit" class="btn btn-danger" id="btn-del" disabled>注销账号</button>
        </form>
        <div id="del-msg"></div>
    </div>
</div>

<script>
const PROVIDER_IDS=['deepseek','qwen','ernie','mimo'];
let PROVIDER_INFO={},keysData={};

function hasKey(pid){return !!(keysData[pid]&&keysData[pid].has_key);}

function initModule(n,excludePid){
    const sel=document.getElementById('provider-pick-'+n);
    const others=p=>p!==excludePid;
    let chosen=PROVIDER_IDS.find(p=>others(p)&&hasKey(p));   // 优先选已配置的厂商
    if(!chosen)chosen=PROVIDER_IDS.find(p=>others(p));        // 否则选任意其他厂商
    if(!chosen)chosen=PROVIDER_IDS[0];
    sel.innerHTML=PROVIDER_IDS.map(p=>`<option value="${p}" ${p===chosen?'selected':''}>${(PROVIDER_INFO[p]||{}).name||p}</option>`).join('');
    sel.onchange=()=>updateModuleStatus(n);
    updateModuleStatus(n);
}

function updateModuleStatus(n){
    const sel=document.getElementById('provider-pick-'+n);
    const pid=sel?sel.value:PROVIDER_IDS[0];
    const name=(PROVIDER_INFO[pid]||{}).name||pid;
    const st=document.getElementById('key-status-'+n);
    st.innerHTML=hasKey(pid)?name+'：✅ 已配置 <button class="btn btn-sm" onclick="deleteKeyFrom('+n+')" style="background:#ef4444;color:#fff;margin-left:6px">删除</button>':name+'：未配置';
}

function updateGlobalStatus(){
    const parts=PROVIDER_IDS.map(pid=>hasKey(pid)?(PROVIDER_INFO[pid]||{}).name||pid:'').filter(Boolean);
    document.getElementById('key-status').textContent=parts.length?'已配置：'+parts.join(' | '):'暂未配置访问密钥';
}

async function loadInfo(){
    const[provResp,keysResp,meResp]=await Promise.all([fetch('api/providers'),fetch('api/keys'),fetch('api/auth/me')]);
    PROVIDER_INFO=await provResp.json();keysData=await keysResp.json();
    updateGlobalStatus();
    initModule(1,null);
    initModule(2,document.getElementById('provider-pick-1').value);
    document.getElementById('account-name').textContent=meResp.ok?(await meResp.json()).username:'已登录';
}

async function saveKey(n){
    const pid=document.getElementById('provider-pick-'+n).value;
    const api_key=document.getElementById('key-input-'+n).value.trim();
    if(!api_key)return alert('请输入访问密钥');
    const resp=await fetch('api/keys',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider:pid,api_key})});
    if(resp.ok){alert('已保存');location.reload();}else alert((await resp.json()).detail||'失败');
}

async function deleteKeyFrom(n){
    const pid=document.getElementById('provider-pick-'+n).value;
    const name=(PROVIDER_INFO[pid]||{}).name||pid;
    if(!confirm('确定删除 '+name+' 的访问密钥？'))return;
    const resp=await fetch('api/keys/'+pid,{method:'DELETE'});
    if(resp.ok)location.reload();else alert((await resp.json()).detail||'失败');
}

async function changePassword(e){e.preventDefault();const pwd=document.getElementById('new-password').value.trim();if(!pwd)return;const msg=document.getElementById('pwd-msg'),resp=await fetch('api/auth/password',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})}),data=await resp.json();msg.style.display='block';msg.style.fontSize='13px';msg.style.marginTop='6px';msg.style.color=resp.ok?'#16a34a':'#dc2626';msg.textContent=data.message||data.detail||'失败';if(resp.ok){document.getElementById('new-password').value='';setTimeout(()=>{window.location.href='login';},1200);}}

document.getElementById('del-confirm').addEventListener('input',function(){document.getElementById('btn-del').disabled=this.value.trim()!=='确认注销此账号';});
async function deleteAccount(e){e.preventDefault();const c=document.getElementById('del-confirm').value.trim();if(c!=='确认注销此账号')return;if(!confirm('不可撤销！'))return;const msg=document.getElementById('del-msg'),resp=await fetch('api/auth/account',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirm:c})}),data=await resp.json();msg.style.display='block';msg.style.fontSize='13px';msg.style.marginTop='6px';if(resp.ok){msg.style.color='#16a34a';msg.textContent='已注销，即将跳转...';setTimeout(()=>{window.location.href='login';},1500);}else{msg.style.color='#dc2626';msg.textContent=data.detail||'失败';}}
loadInfo();loadQQ();

async function loadQQ(){
    const resp=await fetch('api/auth/qq');
    const data=await resp.json();
    const qq=data.qq||'';
    document.getElementById('qq-display').textContent=qq||'空';
    document.getElementById('qq-display').style.color=qq?'':'#94a3b8';
}

function editQQ(){
    const cur=document.getElementById('qq-display').textContent;
    document.getElementById('qq-input').value=cur==='空'?'':cur;
    document.getElementById('qq-edit-row').style.display='flex';
    document.getElementById('qq-input').focus();
}

function cancelEditQQ(){
    document.getElementById('qq-edit-row').style.display='none';
}

async function saveQQ(){
    const qq=document.getElementById('qq-input').value.trim();
    if(!qq){alert('请输入QQ号');return;}
    const resp=await fetch('api/auth/qq',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({qq})});
    if(resp.ok){
        document.getElementById('qq-display').textContent=qq;
        document.getElementById('qq-display').style.color='';
        document.getElementById('qq-edit-row').style.display='none';
    }else{
        alert((await resp.json()).detail||'保存失败');
    }
}
</script>
</body>
</html>
